      }
      /* ===================== TRẠNG THÁI & LƯU TRỮ ===================== */

        me = null,

        F = { q: "", cat: "", style: "", color: "", type: "", sort: "new" };
      try {

      };

        U = (id) => DB.users.find((u) => u.id == id) || { name: "(đã xóa)" },
        nid = () => ++DB.nid;
      const avg = (id) => {
          const r = DB.ratings.filter((x) => x.ad == id);
          return r.length ? r.reduce((s, x) => s + x.s, 0) / r.length : 0;
        },
        ns = (id) => DB.saves.filter((x) => x.ad == id).length;
      const cn = (id) =>
          (DB.cats.find((c) => c.id == id) || { name: "?" }).name,
        tg = (id) => (DB.tags.find((t) => t.id == id) || { name: "?" }).name;
      let tt;
      function toast(m) {
        if (/[💖🎉⭐✅🌷🎀💌]/u.test(m)) burst();
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("on");
        clearTimeout(tt);
        tt = setTimeout(() => t.classList.remove("on"), 2600);
      }
      const go = (n, id) => {

        scrollTo(0, 0);
      };

        go(
          me && me.role == "mod"
            ? "mod"
            : me && me.role == "admin"
              ? "accts"
              : "home",
        );
      const need = () => {
        if (me) return 1;
        view.back = view.n == "detail" ? view.id : 0;
        toast("Hãy đăng nhập trước nhé 🔑");
        go("login");
        return 0;
      };
      const msg = (t, b) => `<div class="empty">${t}<br>
<br>${b ? `<button onclick="home()">← Quay lại</button>` : ""}</div>`;
      const th = (a, c = "") => `<div class="th ${c}">${tpl(a)}</div>`;
      /* ===================== ẢNH BÌA: vẽ mẫu quảng cáo bằng SVG ===================== */
      /* Tự co chữ lại nếu dài hơn khung, để chữ không bị lòi ra ngoài */
      const fitT = (t, f, w) =>
        t.length * f * 0.6 > w
          ? ` textLength="${w}" lengthAdjust="spacingAndGlyphs"`
          : "";
      const DIM = {
        banner: [640, 360],
        video: [640, 360],
        poster: [600, 800],
        social: [600, 750],
      };
      const wrap = (s, n) => {
        const l = [""];
        let i = 0;
        String(s)
          .split(" ")
          .forEach((x) => {
            if (l[i] && (l[i] + " " + x).length > n) l[++i] = x;
            else l[i] = (l[i] + " " + x).trim();
          });
        return l.slice(0, 3);
      };
      /* Ảnh bìa dạng "sân khấu": mọi thẻ cùng kích thước, thiết kế nằm giữa nền màu */
      const stage = (a) => {
        const [w, h] = DIM[a.type] || DIM.banner;
        const tall = a.type == "poster" || a.type == "social";
        return `<div class="stage" style="--h:${a.h == null ? 340 : a.h}"><div class="art ${tall ? "tall" : "wide"}" style="aspect-ratio:${w}/${h}">${tpl(a)}</div></div>`;
      };
      function tpl(a) {
        const [W, H] = DIM[a.type] || DIM.banner,
          h = a.h == null ? 340 : a.h,
          c = (o, l) => `hsl(${(h + o) % 360} 90% ${l}%)`,
          k = (a.lay || 0) % 4,
          m = k == 1,
          fs = Math.round(W * (H > W ? 0.11 : 0.082)),
          mx = Math.max(8, Math.round((W * (m ? 0.8 : 0.62)) / (fs * 0.52))),
          L = wrap(a.t1 || a.title || "", mx),
          S = wrap(a.t2 || a.desc || "", Math.round(mx * 1.7)).slice(0, 2),
          cta = a.cta || "Xem ngay",
          x = m ? W / 2 : W * 0.08,
          y0 = H > W ? H * 0.2 : H * 0.26,
          an = m ? "middle" : "start",
          id = "g" + Math.random().toString(36).slice(2, 8),
          dk = `hsl(${h} 45% 22%)`;
        let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="${c(0, 90)}"/>
<stop offset="1" stop-color="${c(55, 82)}"/>
</linearGradient>
</defs>
<rect width="${W}" height="${H}" fill="url(#${id})"/>`;
        if (a.img)
          s += `<image href="${a.img}" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice"/>
<defs><linearGradient id="${id}o" x1="0" y1="0" x2="${m ? 0 : 1}" y2="${m ? 1 : 0}"><stop offset="0" stop-color="${c(0, 96)}" stop-opacity=".9"/><stop offset=".6" stop-color="${c(0, 96)}" stop-opacity=".35"/><stop offset="1" stop-color="${c(0, 96)}" stop-opacity="0"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id}o)"/>`;
        else
          s += [
            `<circle cx="${W * 0.82}" cy="${H * 0.5}" r="${H * 0.34}" fill="${c(300, 94)}" opacity=".8"/>
<circle cx="${W * 0.7}" cy="${H * 0.86}" r="${H * 0.12}" fill="${c(180, 88)}"/>
<circle cx="${W * 0.93}" cy="${H * 0.12}" r="${H * 0.07}" fill="#fff" opacity=".9"/>`,
            `<path d="M0 ${H * 0.8}Q${W * 0.25} ${H * 0.62} ${W * 0.5} ${H * 0.8}T${W} ${H * 0.8}V${H}H0Z" fill="${c(300, 92)}" opacity=".8"/>
<circle cx="${W * 0.1}" cy="${H * 0.12}" r="${H * 0.1}" fill="#fff" opacity=".8"/>
<circle cx="${W * 0.9}" cy="${H * 0.2}" r="${H * 0.14}" fill="${c(180, 90)}" opacity=".7"/>`,
            `<polygon points="${W * 0.55},0 ${W},0 ${W},${H} ${W * 0.3},${H}" fill="${c(300, 92)}" opacity=".85"/>
<circle cx="${W * 0.8}" cy="${H * 0.35}" r="${H * 0.18}" fill="#fff" opacity=".9"/>
<circle cx="${W * 0.8}" cy="${H * 0.35}" r="${H * 0.1}" fill="${c(30, 80)}"/>`,
            `<path d="M${W * 0.6} ${H * 0.92}V${H * 0.35}a${W * 0.2} ${W * 0.2} 0 0 1 ${W * 0.4} 0V${H * 0.92}Z" fill="#fff" opacity=".85"/>
<path d="M${W * 0.65} ${H * 0.88}V${H * 0.37}a${W * 0.15} ${W * 0.15} 0 0 1 ${W * 0.3} 0V${H * 0.88}Z" fill="${c(300, 86)}"/>
<circle cx="${W * 0.12}" cy="${H * 0.9}" r="${H * 0.09}" fill="${c(180, 86)}"/>`,
          ][k];
        if (a.type == "video")
          s += `<circle cx="${W * 0.82}" cy="${H * 0.5}" r="${H * 0.11}" fill="#fff"/>
<path d="M${W * 0.8} ${H * 0.43}v${H * 0.14}l${H * 0.12} ${-H * 0.07}z" fill="${c(0, 60)}"/>`;
        L.forEach(
          (t, i) =>
            (s += `<text x="${x}" y="${y0 + i * fs * 1.08}" text-anchor="${an}" font-family="Baloo 2,Quicksand,Arial,sans-serif" font-weight="800" font-size="${fs}" fill="${dk}"${fitT(t, fs, W * 0.84)}>${esc(t)}</text>`),
        );
        const ys = y0 + L.length * fs * 1.08;
        S.forEach(
          (t, i) =>
            (s += `<text x="${x}" y="${ys + i * fs * 0.5}" text-anchor="${an}" font-family="Quicksand,Arial,sans-serif" font-weight="700" font-size="${fs * 0.4}" fill="${dk}"${fitT(t, fs * 0.4, W * 0.84)}>${esc(t)}</text>`),

          return toast("Tệp không hợp lệ, hãy chọn ảnh hoặc video");
        const fin = (img) => {
          const o = {
            title: t,
            desc: d,
            t1: t,
            t2: d,
            type: $("#fy").value,
            cat: +$("#fc").value,
            tags,
            status: "pending",
            reason: "",

      function bgImg(i) {
        const f = i.files[0];
        if (!f) return;
        if (!f.type.startsWith("image/")) return toast("Hãy chọn một tệp ảnh");
        if (f.size > 1.5e6)
          return toast("Ảnh hơi nặng, chọn ảnh dưới 1.5MB nhé");
        const r = new FileReader();
        r.onload = () => {
          S.img = r.result;
          R();
        };
        r.readAsDataURL(f);

      function dl() {
        const [W, H] = DIM[S.type],
          im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas");
          c.width = W * 2;
          c.height = H * 2;
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          c.toBlob((b) => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(b);
            a.download = "winie-" + S.type + ".png";
            a.click();
            toast("Đã tải ảnh về 🎉");
          });
        };
        im.src =
          "data:image/svg+xml;charset=utf-8," +
          encodeURIComponent(

      /* ===================== HIỆU ỨNG: pháo hoa, hiện dần, nghiêng 3D, lấp lánh ===================== */
      function burst() {

          const s = document.createElement("i");
          s.className = "sp b";
          s.textContent = "✦✿♥★"[i % 4];
          s.style.cssText = `left:50%;top:60%;--x:${(Math.random() - 0.5) * 500}px;--y:${-Math.random() * 320}px;color:hsl(${Math.random() * 360} 85% 70%)`;
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 1000);
        }
      }
      const io = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("in");
              io.unobserve(e.target);
            }
          }),
        { threshold: 0.08 },
      );
      const rv = () =>
        document
          .querySelectorAll(
            "#app .grid>*,#app .box,#app .bt,#app h2,#app details",
          )
          .forEach((el) => {
            el.classList.add("rv");
            io.observe(el);
          });
      let lt = 0;
      addEventListener("pointermove", (e) => {
        const c = e.target.closest && e.target.closest(".card");
        if (c) {
          const r = c.getBoundingClientRect(),
            x = (e.clientX - r.left) / r.width - 0.5,
            y = (e.clientY - r.top) / r.height - 0.5;
          c.style.transform = `perspective(700px) rotateY(${x * 12}deg) rotateX(${-y * 12}deg) scale(1.03)`;
        }
        const n = Date.now();
        if (n - lt < 70 || e.pointerType == "touch") return;
        lt = n;
        const s = document.createElement("i");
        s.className = "sp";
        s.textContent = "✦✿♥★"[n % 4];
        s.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;color:hsl(${n % 360} 85% 70%)`;
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 800);
      });
      addEventListener("pointerout", (e) => {
        const c = e.target.closest && e.target.closest(".card");
        if (c) c.style.transform = "";
      });

      R();
    </script>
  </body>
</html>
